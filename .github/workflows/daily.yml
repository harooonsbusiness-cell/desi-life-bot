name: Desi Life Daily Automation - ElevenLabs 1st

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Video mode'
        required: true
        default: 'long'
        type: choice
        options:
          - long
          - short
          - both
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 14 * * *'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run video - ElevenLabs 1st MOST NATURAL
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MODE: ${{ inputs.mode || 'long' }}
        run: |
          echo "ElevenLabs 1st - Most Natural"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=long python final_cloud_bot.py
            sleep 30
            MODE=short python final_cloud_bot.py
          else
            if [ "$MODE" = "both" ]; then
              MODE=long python final_cloud_bot.py
              sleep 30
              MODE=short python final_cloud_bot.py
            else
              python final_cloud_bot.py
            fi
          fi
