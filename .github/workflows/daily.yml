name: Desi Life Daily - ULTIMATE PRO CTR - YT ONLY - RESEARCH BASED

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Video mode'
        required: true
        default: 'long'
        type: choice
        options:
          - long
          - short
          - both
  schedule:
    - cron: '0 3 * * *'  # 8 AM PKT
    - cron: '0 14 * * *' # 7 PM PKT - PEAK

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run video - ULTIMATE PRO CTR (Yellow #FFEA00 + 18px stroke + <12 chars)
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MODE: ${{ inputs.mode || 'long' }}
        run: |
          echo "Mode: $MODE - ULTIMATE PRO CTR - Yellow #FFEA00 highest scroll-stop + Anton 145px + 18px stroke + <12 chars hook"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=long python final_cloud_bot.py
            sleep 30
            MODE=short python final_cloud_bot.py
          else
            if [ "$MODE" = "both" ]; then
              MODE=long python final_cloud_bot.py
              sleep 30
              MODE=short python final_cloud_bot.py
            else
              python final_cloud_bot.py
            fi
          fi
